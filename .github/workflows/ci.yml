name: CI — Godot Headless & GUT

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-godot-headless:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Godot 4.4.1
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false

      - name: Import project resources (headless)
        run: godot --headless --path . --import --quit

      - name: Run GUT test suite
        run: godot --headless --path . -s addons/gut/gut_cmdln.gd -gdir=res://tests -ginclude_subdirs -gexit
